<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-pulse {
        animation: blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .mono {
        font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
      }
      .ln {
        font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #475569;
        text-anchor: end;
      }
      .code-text {
        font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
      }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="1" y="1" width="918" height="418" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Top Glowing Edge -->
  <path d="M 12 1.5 L 908 1.5" stroke="url(#emeraldGlow)" stroke-width="2" />

  <!-- macOS Title Bar (Height: 38px) -->
  <rect x="1" y="1" width="918" height="37" rx="10" fill="#0d1322" />
  <rect x="1" y="28" width="918" height="10" fill="#0d1322" />
  <line x1="1" y1="38" x2="919" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Traffic Light Dots -->
  <circle cx="24" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="43" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="5.5" fill="#27c93f" />

  <!-- Titlebar Center Label -->
  <text x="460" y="23" text-anchor="middle" class="mono" font-size="11.5" fill="#94a3b8" letter-spacing="0.4">nexus-pyodide-worker — cpython-3.12.wasm — 60fps</text>

  <!-- Titlebar Right Status Badge -->
  <rect x="765" y="9" width="138" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="778" cy="19" r="3.5" fill="#10b981" />
  <text x="788" y="23" class="mono" font-size="10" font-weight="600" fill="#10b981" letter-spacing="0.5">SANDBOX READY</text>

  <!-- Vertical Pane Separator at x=455 -->
  <line x1="455" y1="38" x2="455" y2="419" stroke="#1e293b" stroke-width="1" />

  <!-- ================= LEFT PANE: MONACO EDITOR SIMULATION ================= -->
  <!-- Left Header Tab Bar (y=38 to 66) -->
  <rect x="1" y="38" width="454" height="28" fill="#0b1120" />
  <path d="M 12 38 L 150 38 L 150 66 L 12 66 Z" fill="#1e293b" fill-opacity="0.45" />
  <line x1="12" y1="38" x2="150" y2="38" stroke="#38bdf8" stroke-width="2" />
  <text x="24" y="56" class="mono" font-size="11" fill="#38bdf8">🐍</text>
  <text x="40" y="56" class="mono" font-size="11" fill="#e2e8f0" font-weight="500">mission_001.py</text>
  <text x="360" y="56" class="mono" font-size="10.5" fill="#64748b">Tier 1 • M001</text>
  <line x1="1" y1="66" x2="455" y2="66" stroke="#1e293b" stroke-width="1" />

  <!-- Editor Code Body -->
  <!-- Line 1 -->
  <text x="32" y="92" class="ln">1</text>
  <text x="48" y="92" class="code-text" fill="#64748b" font-style="italic"># Mission 001: HealthTech Vitals Tracker</text>

  <!-- Line 2 -->
  <text x="32" y="114" class="ln">2</text>
  <text x="48" y="114" class="code-text" fill="#64748b" font-style="italic"># Client: Square Hospitals Ltd. (Rule 22)</text>

  <!-- Line 3 -->
  <text x="32" y="136" class="ln">3</text>

  <!-- Line 4 -->
  <text x="32" y="158" class="ln">4</text>
  <text x="48" y="158" class="code-text" fill="#f8fafc">patient_name </text>
  <text x="144" y="158" class="code-text" fill="#38bdf8">=</text>
  <text x="156" y="158" class="code-text" fill="#34d399"> "Rahim"</text>

  <!-- Line 5 -->
  <text x="32" y="180" class="ln">5</text>
  <text x="48" y="180" class="code-text" fill="#f8fafc">heart_rate </text>
  <text x="128" y="180" class="code-text" fill="#38bdf8">=</text>
  <text x="140" y="180" class="code-text" fill="#f59e0b"> 72</text>
  <text x="168" y="180" class="code-text" fill="#64748b" font-style="italic">  # Pulse (BPM)</text>

  <!-- Line 6 -->
  <text x="32" y="202" class="ln">6</text>
  <text x="48" y="202" class="code-text" fill="#f8fafc">spo2_level </text>
  <text x="128" y="202" class="code-text" fill="#38bdf8">=</text>
  <text x="140" y="202" class="code-text" fill="#f59e0b"> 98.5</text>
  <text x="180" y="202" class="code-text" fill="#64748b" font-style="italic"> # Blood Oxygen %</text>

  <!-- Line 7 -->
  <text x="32" y="224" class="ln">7</text>

  <!-- Line 8 -->
  <text x="32" y="246" class="ln">8</text>
  <text x="48" y="246" class="code-text" fill="#64748b" font-style="italic"># Single Concept Law: print() standard output</text>

  <!-- Line 9 -->
  <text x="32" y="268" class="ln">9</text>
  <text x="48" y="268" class="code-text" fill="#38bdf8">print</text>
  <text x="86" y="268" class="code-text" fill="#94a3b8">(</text>
  <text x="94" y="268" class="code-text" fill="#34d399">f"Patient: </text>
  <text x="164" y="268" class="code-text" fill="#f8fafc">{patient_name}</text>
  <text x="264" y="268" class="code-text" fill="#34d399">"</text>
  <text x="272" y="268" class="code-text" fill="#94a3b8">)</text>

  <!-- Line 10 -->
  <text x="32" y="290" class="ln">10</text>
  <text x="48" y="290" class="code-text" fill="#38bdf8">print</text>
  <text x="86" y="290" class="code-text" fill="#94a3b8">(</text>
  <text x="94" y="290" class="code-text" fill="#34d399">f"Pulse: </text>
  <text x="154" y="290" class="code-text" fill="#f8fafc">{heart_rate}</text>
  <text x="238" y="290" class="code-text" fill="#34d399"> BPM | SpO2: </text>
  <text x="324" y="290" class="code-text" fill="#f8fafc">{spo2_level}</text>
  <text x="404" y="290" class="code-text" fill="#34d399">%"</text>
  <text x="412" y="290" class="code-text" fill="#94a3b8">)</text>

  <!-- Line 11 -->
  <text x="32" y="312" class="ln">11</text>

  <!-- Line 12 -->
  <text x="32" y="334" class="ln">12</text>
  <text x="48" y="334" class="code-text" fill="#64748b" font-style="italic"># AST Rule 24: Preflight syntax audit</text>

  <!-- Line 13 -->
  <text x="32" y="356" class="ln">13</text>
  <text x="48" y="356" class="code-text" fill="#10b981" font-weight="600">assert</text>
  <text x="96" y="356" class="code-text" fill="#f8fafc"> heart_rate </text>
  <text x="180" y="356" class="code-text" fill="#38bdf8">==</text>
  <text x="200" y="356" class="code-text" fill="#f59e0b"> 72</text>
  <text x="228" y="356" class="code-text" fill="#64748b"> # Verified</text>

  <!-- Left Bottom Status Line -->
  <rect x="1" y="392" width="454" height="26" fill="#090d16" />
  <line x1="1" y1="392" x2="455" y2="392" stroke="#1e293b" stroke-width="1" />
  <text x="16" y="409" class="mono" font-size="10" fill="#64748b">UTF-8</text>
  <text x="64" y="409" class="mono" font-size="10" fill="#64748b">Python 3.12.3 (Pyodide WASM)</text>
  <text x="340" y="409" class="mono" font-size="10" fill="#10b981">● Ln 10, Col 43</text>

  <!-- ================= RIGHT PANE: TERMINAL & MEMORY MODEL ================= -->
  <!-- Right Header Tab Bar (y=38 to 66) -->
  <rect x="456" y="38" width="462" height="28" fill="#0b1120" />
  <text x="472" y="56" class="mono" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.6">TERMINAL STREAM &amp; HEAP VISUALIZER</text>
  <text x="802" y="56" class="mono" font-size="10" fill="#64748b">HEAP: 12.8 MB</text>
  <line x1="455" y1="66" x2="919" y2="66" stroke="#1e293b" stroke-width="1" />

  <!-- Memory Box Model Diagram Header -->
  <text x="472" y="86" class="mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.8">🧠 STEP 5: MEMORY ALLOCATION (BOX MODEL)</text>

  <!-- Box 1: heart_rate [72] -> 0x7ffd9b -->
  <g transform="translate(472, 94)">
    <rect x="0" y="0" width="206" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="6" y="6" width="60" height="15" rx="3" fill="#1e293b" />
    <text x="12" y="17" class="mono" font-size="9" fill="#94a3b8">int [28B]</text>
    <text x="144" y="17" class="mono" font-size="9.5" fill="#64748b">0x7ffd9b</text>
    <text x="10" y="40" class="mono" font-size="12" fill="#38bdf8" font-weight="600">heart_rate</text>
    <text x="96" y="40" class="mono" font-size="12" fill="#64748b">→</text>
    <rect x="114" y="24" width="44" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="136" y="39" class="mono" font-size="12.5" fill="#f59e0b" font-weight="700" text-anchor="middle">72</text>
  </g>

  <!-- Box 2: patient_name ["Rahim"] -> 0x7ffd80 -->
  <g transform="translate(688, 94)">
    <rect x="0" y="0" width="216" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="6" y="6" width="62" height="15" rx="3" fill="#1e293b" />
    <text x="12" y="17" class="mono" font-size="9" fill="#94a3b8">str [54B]</text>
    <text x="154" y="17" class="mono" font-size="9.5" fill="#64748b">0x7ffd80</text>
    <text x="10" y="40" class="mono" font-size="12" fill="#38bdf8" font-weight="600">patient_name</text>
    <text x="108" y="40" class="mono" font-size="12" fill="#64748b">→</text>
    <rect x="122" y="24" width="84" height="22" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="164" y="39" class="mono" font-size="11.5" fill="#34d399" font-weight="700" text-anchor="middle">"Rahim"</text>
  </g>

  <text x="472" y="165" class="mono" font-size="10" fill="#64748b">💡 Analogy: Labeled drawers in memory. Value updates in-place, name stays constant.</text>

  <!-- Subtle Divider -->
  <line x1="472" y1="178" x2="904" y2="178" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Terminal Stream Execution Output -->
  <text x="472" y="198" class="mono" font-size="11.5" fill="#10b981">nexus@browser-worker</text>
  <text x="632" y="198" class="mono" font-size="11.5" fill="#94a3b8">:~# python3 mission_001.py</text>

  <text x="472" y="222" class="mono" font-size="12" fill="#cbd5e1" font-weight="500">Patient: Rahim</text>
  <text x="472" y="244" class="mono" font-size="12" fill="#cbd5e1" font-weight="500">Pulse: 72 BPM | SpO2: 98.5%</text>

  <!-- Verification Badge -->
  <g transform="translate(472, 260)">
    <rect x="0" y="0" width="432" height="34" rx="6" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="14" y="22" class="mono" font-size="11.5" font-weight="700" fill="#34d399">[✓ Rule 24 AST: PASS | CPython 3.12 WASM: 0ms]</text>
  </g>

  <!-- Next Prompt Line with Blinking Cursor -->
  <text x="472" y="322" class="mono" font-size="11.5" fill="#10b981">nexus@browser-worker</text>
  <text x="632" y="322" class="mono" font-size="11.5" fill="#94a3b8">:~# </text>
  <rect x="664" y="310" width="7" height="15" fill="#10b981" class="cursor-pulse" />

  <!-- Domain EventBus Telemetry Bar (y=348 to 402) -->
  <g transform="translate(472, 344)">
    <rect x="0" y="0" width="432" height="54" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" class="mono" font-size="9.5" fill="#64748b" font-weight="600">DOMAIN EVENTBUS:</text>
    <text x="128" y="20" class="mono" font-size="9.5" fill="#a78bfa" font-weight="600">MISSION_COMPLETED (Phase 2 Sealed)</text>
    
    <text x="12" y="40" class="mono" font-size="10" fill="#38bdf8">XP: +120</text>
    <text x="76" y="40" class="mono" font-size="10" fill="#64748b">•</text>
    <text x="90" y="40" class="mono" font-size="10" fill="#34d399">Understanding: 100%</text>
    <text x="234" y="40" class="mono" font-size="10" fill="#64748b">•</text>
    <text x="248" y="40" class="mono" font-size="10" fill="#f59e0b">SM-2 Review: In 1 Day</text>
  </g>
</svg>
