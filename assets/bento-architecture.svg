<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080d16" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1726" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="100%" stop-color="#090814" />
    </linearGradient>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #f8fafc;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        fill: #94a3b8;
        line-height: 1.45;
      }
      .badge-text {
        font-family: 'SFMono-Regular', 'JetBrains Mono', monospace;
        font-size: 9.5px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- ================= CARD 1: 0ms WASM RUNTIME ================= -->
  <g transform="translate(12, 10)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="286" height="200" rx="10" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Top Accent Line -->
    <path d="M 10 0 L 276 0" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

    <!-- Top Tag -->
    <rect x="16" y="16" width="132" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="82" y="27" class="badge-text" fill="#34d399" text-anchor="middle" dominant-baseline="central">0ms CLIENT RUNTIME</text>

    <!-- Title -->
    <text x="16" y="64" class="card-title">⚡ 0ms WASM Runtime</text>

    <!-- Subtitle / Metric Pills -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="94" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="47" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">$0 Server Bills</text>

      <rect x="100" y="0" width="82" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="141" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">CPython 3.12</text>

      <rect x="188" y="0" width="76" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="226" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">100% Offline</text>
    </g>

    <!-- Description -->
    <text x="16" y="122" class="card-desc">Code compiles and executes entirely inside</text>
    <text x="16" y="140" class="card-desc">a dedicated Web Worker thread (Pyodide).</text>
    <text x="16" y="158" class="card-desc">Zero queue latency, zero backend costs,</text>
    <text x="16" y="176" class="card-desc" fill="#10b981">and an unblocked 60 FPS Monaco editor.</text>
  </g>

  <!-- ================= CARD 2: RULE 24 AST CONFINEMENT ================= -->
  <g transform="translate(317, 10)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="286" height="200" rx="10" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Top Accent Line -->
    <path d="M 10 0 L 276 0" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />

    <!-- Top Tag -->
    <rect x="16" y="16" width="138" height="22" rx="4" fill="#083344" fill-opacity="0.5" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <text x="85" y="27" class="badge-text" fill="#22d3ee" text-anchor="middle" dominant-baseline="central">CLOSED-WORLD AST</text>

    <!-- Title -->
    <text x="16" y="64" class="card-title">🔒 Rule 24 AST Confinement</text>

    <!-- Subtitle / Metric Pills -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="94" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="47" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">AST Inspection</text>

      <rect x="100" y="0" width="76" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="138" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">Exit Code 2</text>

      <rect x="182" y="0" width="82" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="223" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">Zero Leakage</text>
    </g>

    <!-- Description -->
    <text x="16" y="122" class="card-desc">Automated compile-time Python AST visitor</text>
    <text x="16" y="140" class="card-desc">audits every starter code and practice task.</text>
    <text x="16" y="158" class="card-desc">Strictly halts CI if unearned syntax (loops,</text>
    <text x="16" y="176" class="card-desc" fill="#22d3ee">functions, imports) enters a mission.</text>
  </g>

  <!-- ================= CARD 3: 23-EVENT DECOUPLED ENGINE ================= -->
  <g transform="translate(622, 10)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="286" height="200" rx="10" fill="url(#cardGrad3)" stroke="#1e293b" stroke-width="1.2" />
    <!-- Top Accent Line -->
    <path d="M 10 0 L 276 0" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />

    <!-- Top Tag -->
    <rect x="16" y="16" width="144" height="22" rx="4" fill="#2e1065" fill-opacity="0.5" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1" />
    <text x="88" y="27" class="badge-text" fill="#c084fc" text-anchor="middle" dominant-baseline="central">DECOUPLED EVENTBUS</text>

    <!-- Title -->
    <text x="16" y="64" class="card-title">🧠 23-Event Decoupled Engine</text>

    <!-- Subtitle / Metric Pills -->
    <g transform="translate(16, 78)">
      <rect x="0" y="0" width="82" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="41" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">2-Phase Seal</text>

      <rect x="88" y="0" width="84" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="130" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">SM-2 Spaced</text>

      <rect x="178" y="0" width="82" height="18" rx="3" fill="#1e293b" fill-opacity="0.8" />
      <text x="219" y="9" class="badge-text" fill="#cbd5e1" text-anchor="middle" dominant-baseline="central">DAG Unlock</text>
    </g>

    <!-- Description -->
    <text x="16" y="122" class="card-desc">Zero tight coupling between UI and core logic.</text>
    <text x="16" y="140" class="card-desc">Synchronous pub/sub orchestrates dynamic</text>
    <text x="16" y="158" class="card-desc">scoring, level-ups, DAG prerequisites, and</text>
    <text x="16" y="176" class="card-desc" fill="#c084fc">SuperMemo SM-2 spaced review scheduling.</text>
  </g>
</svg>
